[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lanis-mcp"
version = "0.1.0"
description = "MCP server for Schulportal Hessen (Lanis)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.3.0",
    "lanisapi==0.4.1",
    # lanisapi imports selectolax.parser, which selectolax 1.0 removed.
    "selectolax==0.4.13",
]

[project.optional-dependencies]
dev = [
    "anyio==4.15.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.2",
]

[project.scripts]
lanis-mcp = "lanis_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lanis_mcp"]

[tool.hatch.envs.default]
dependencies = []

[tool.ruff.lint]
# Keep the rule set ruff used as its default before 0.16.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # lanisapi passes cookies per-request to httpx, which is deprecated in newer
    # httpx versions. This is a third-party issue we cannot fix upstream.
    "ignore::DeprecationWarning:httpx",
]
