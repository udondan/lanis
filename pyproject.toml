[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylanis"
version = "0.2.0"
description = "MCP server for Schulportal Hessen (Lanis), with SDK and CLI to follow"
readme = "README.md"
license = "MIT"
# The second file covers the vendored LanisAPI in src/lanis_mcp/lanisapi/.
license-files = ["LICENSE", "src/lanis_mcp/lanisapi/LICENSE"]
authors = [{ name = "Daniel Schroeder", email = "deemes79@googlemail.com" }]
keywords = ["lanis", "schulportal", "hessen", "mcp", "mcp-server", "school", "vertretungsplan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.3.0",
    # Dependencies of the vendored LanisAPI (src/lanis_mcp/lanisapi/).
    "httpx==0.28.1",
    "pycryptodomex==3.24.1",
    "selectolax==1.0.2",
]

[project.urls]
Repository = "https://github.com/udondan/pylanis"
Issues = "https://github.com/udondan/pylanis/issues"
Changelog = "https://github.com/udondan/pylanis/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "anyio==4.15.1",
    "build==1.6.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[project.scripts]
lanis-mcp = "lanis_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lanis_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.envs.default]
dependencies = []

[tool.ruff.lint]
# Keep the rule set ruff used as its default before 0.16.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
