---
name: Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Runs with a personal token: a release created with the GITHUB_TOKEN
      # would not start the Publish workflow.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.OVERRIDE_TOKEN }}
